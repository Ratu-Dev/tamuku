<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Tamuku: undangan, RSVP, dan buku tamu digital" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="kawung" width="28" height="28" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#f2c14e" stroke-width="1.2" opacity=".28">
        <ellipse cx="14" cy="7" rx="4.5" ry="7"/>
        <ellipse cx="14" cy="21" rx="4.5" ry="7"/>
        <ellipse cx="7" cy="14" rx="7" ry="4.5"/>
        <ellipse cx="21" cy="14" rx="7" ry="4.5"/>
      </g>
      <circle cx="14" cy="14" r="1.4" fill="#f2c14e" opacity=".35"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="1" stop-color="#27408b"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="260" rx="20"/></clipPath>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .drift{animation:drift 7s linear infinite}
    .name{opacity:0;animation:cycle 9s infinite}
    .n2{animation-delay:3s}
    .n3{animation-delay:6s}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
    .rise{animation:rise 1s ease-out both}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-28px,-28px)}}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}5%,30%{opacity:1;transform:translateY(0)}35%,100%{opacity:0;transform:translateY(-6px)}}
    @keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){.drift,.name,.pulse,.rise{animation:none}.n1{opacity:1}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect class="drift" x="0" y="0" width="1000" height="360" fill="url(#kawung)"/>

    <g class="rise">
      <text x="56" y="120" font-size="64" font-weight="800" fill="#ffffff">Tamuku</text>
      <text x="58" y="158" font-size="20" fill="#f2c14e">Undangan, RSVP, dan buku tamu digital</text>
      <text x="58" y="190" font-size="15" fill="#c9d3ff">Scan QR, lalu nama tamu tampil di layar sambutan.</text>
    </g>

    <g transform="translate(540 52)">
      <rect width="310" height="156" rx="18" fill="#ffffff"/>
      <circle class="pulse" cx="30" cy="32" r="6" fill="#2fb36b"/>
      <circle cx="30" cy="32" r="6" fill="#2fb36b"/>
      <text x="48" y="37" font-size="14" font-weight="600" fill="#4a5599">Check-in berhasil</text>
      <text x="26" y="78" font-size="15" fill="#6b74a8">Selamat datang,</text>
      <g font-size="26" font-weight="800" fill="#1b2a6b">
        <text class="name n1" x="26" y="114">Tamu1 Wijaya</text>
        <text class="name n2" x="26" y="114">Bu Sari Dewi</text>
        <text class="name n3" x="26" y="114">Keluarga Hadi</text>
      </g>
      <rect x="26" y="130" width="258" height="4" rx="2" fill="#f2c14e"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
